server:
  port: 8083

spring:
  application:
    name: ms-carrito

  # CONFIGURACIÓN DE SEGURIDAD (AZURE AD)
  security:
    oauth2:
      resourceserver:
        jwt:
          # URL para descargar los JWKS y validar la firma de los tokens
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:tu-tenant-id-aqui}/v2.0

  # CONFIGURACIÓN DE BASE DE DATOS POSTGRESQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_carrito}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # CONFIGURACIÓN DE JPA E HIBERNATE
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true